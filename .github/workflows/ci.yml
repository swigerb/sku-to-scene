name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKU2SCENE_MODE: mock
      SKU2SCENE_QA_EVALUATORS: "off"
      SKU2SCENE_DATA_DIR: ${{ github.workspace }}/.ci-data
      SKU2SCENE_MOCK_LATENCY_SCALE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install into the project .venv (the layout the MCP launcher expects)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Test (mock mode, no Azure)
        run: .venv/bin/python -m pytest -q
      - name: Smoke - two-tier LTO demo (mock)
        run: |
          .venv/bin/sku2scene demo lto --step drafts
          .venv/bin/sku2scene demo lto --step hero --select 2
      - name: MCP stdio via the configured .mcp.json launcher
        run: .venv/bin/python scripts/verify_mcp_stdio.py
